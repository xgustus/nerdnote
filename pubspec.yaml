name: nerdnote
description: "Suas notas nerds!"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  file_picker: ^13.1.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

  # Adicione estas linhas para controlar o zoom no Android
  adaptive_icon_background: "#020202" # Cor de fundo do ícone adaptativo
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 0

  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#020202"